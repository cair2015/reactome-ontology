  identifier:
    name: identifier
    definition_uri: https://w3id.org/reactome-ontology/identifier
    description: Identifier string assigned by an external reference database.
    comments:
    - Examples include UniProt accessions, ChEBI identifiers, or GO term identifiers.
    - This is the raw accession string; the full CURIE form is stored in the id slot.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:identifier
    slot_uri: reactome:identifier
    owner: database_identifier
    domain_of:
    - reference_entity
    - database_identifier
    range: string
    multivalued: false
  access_url:
    name: access_url
    definition_uri: https://w3id.org/reactome-ontology/access_url
    description: URL template or access URL used to resolve an identifier in a reference
      database.
    comments:
    - Can encode direct or templated resolver behavior.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:accessUrl
    slot_uri: reactome:accessUrl
    owner: reference_database
    domain_of:
    - reference_database
    range: uri
    multivalued: false
  identifier_prefix:
    name: identifier_prefix
    definition_uri: https://w3id.org/reactome-ontology/identifier_prefix
    description: Prefix or namespace abbreviation used by a reference database.
    comments:
    - Useful for CURIE generation and namespace harmonization.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:identifierPrefix
    slot_uri: reactome:identifierPrefix
    owner: reference_database
    domain_of:
    - reference_database
    range: string
    multivalued: false
  resource_identifier:
    name: resource_identifier
    definition_uri: https://w3id.org/reactome-ontology/resource_identifier
    description: Identifier for the reference resource itself rather than for entries
      inside it.
    comments:
    - Supports metadata about the authority record for a database.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:resourceIdentifier
    slot_uri: reactome:resourceIdentifier
    owner: reference_database
    domain_of:
    - reference_database
    range: string
    multivalued: false
  url:
    name: url
    definition_uri: https://w3id.org/reactome-ontology/url
    description: General URL associated with an object.
    comments:
    - Often used for resource metadata pages or resolver entry points.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:url
    slot_uri: reactome:url
    owner: reference_database
    domain_of:
    - reference_database
    range: uri
    multivalued: false
  pubmed_id:
    name: pubmed_id
    definition_uri: https://w3id.org/reactome-ontology/pubmed_id
    description: PubMed identifier for a literature reference.
    comments:
    - Stored as string for broad interoperability with exports and loaders.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:pubmedId
    slot_uri: reactome:pubmedId
    owner: literature_reference
    domain_of:
    - literature_reference
    range: string
    multivalued: false
    pattern: ^[0-9]+$
  orcid:
    name: orcid
    definition_uri: https://w3id.org/reactome-ontology/orcid
    description: ORCID identifier for a person involved in curation or authorship.
    comments:
    - Useful for curator and contributor disambiguation.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:orcid
    slot_uri: reactome:orcid
    owner: person
    domain_of:
    - person
    range: uri
    multivalued: false
  ncbi_taxon_id:
    name: ncbi_taxon_id
    definition_uri: https://w3id.org/reactome-ontology/ncbi_taxon_id
    description: Taxonomic identifier aligned to the NCBI Taxonomy.
    comments:
    - Used on OrganismTaxon and Taxon records.
    - The id slot on these nodes is constructed as NCBITaxon:{ncbi_taxon_id}.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:ncbiTaxonId
    slot_uri: reactome:ncbiTaxonId
    owner: taxon
    domain_of:
    - organism_taxon
    - taxon
    range: string
    multivalued: false
    pattern: ^[0-9]+$
  previous_stable_identifier:
    name: previous_stable_identifier
    definition_uri: https://w3id.org/reactome-ontology/previous_stable_identifier
    description: Deprecated or previous stable Reactome identifier retained for traceability.
    comments:
    - Useful during migration, identifier replacement, and legacy resolution.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:previousStableIdentifier
    slot_uri: reactome:previousStableIdentifier
    owner: database_object
    domain_of:
    - database_object
    range: string
    multivalued: false
  instanceEdit__date:
    name: instanceEdit__date
    description: Timestamp or date string for the edit activity.
    from_schema: https://w3id.org/reactome-ontology
    slot_uri: reactome:date
    alias: date
    owner: instance_edit
    domain_of:
    - instance_edit
    range: datetime
  instanceEdit__author:
    name: instanceEdit__author
    description: Person or people responsible for the edit activity.
    from_schema: https://w3id.org/reactome-ontology
    slot_uri: reactome:author
    alias: author
    owner: instance_edit
    domain_of:
    - instance_edit
    range: person
    multivalued: true
    inlined: false
  summation__text:
    name: summation__text
    description: Narrative summary text.
    from_schema: https://w3id.org/reactome-ontology
    slot_uri: reactome:text
    alias: text
    owner: summation
    domain_of:
    - summation
    range: string
    required: true
  reactomeDataset__database_objects:
    name: reactomeDataset__database_objects
    description: Collection of Reactome objects keyed by identifier.
    from_schema: https://w3id.org/reactome-ontology
    slot_uri: reactome:database_objects
    alias: database_objects
    owner: reactome_dataset
    domain_of:
    - reactome_dataset
    range: database_object
    multivalued: true
    inlined: true
    inlined_as_list: false
  database_object_reactome_db_id:
    name: database_object_reactome_db_id
    definition_uri: https://w3id.org/reactome-ontology/reactome_db_id
    description: Internal Reactome database identifier assigned to a database object.
    comments:
    - Kept for provenance and round-tripping only; never used as a foreign key in
      this ontology schema.
    - Reactome DB_ID values are implementation-oriented integers rather than stable
      public identifiers.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:reactomeDbId
    is_a: reactome_db_id
    domain: database_object
    slot_uri: reactome:reactomeDbId
    alias: reactome_db_id
    owner: database_object
    domain_of:
    - database_object
    is_usage_slot: true
    usage_slot_name: reactome_db_id
    range: integer
    required: true
    multivalued: false
  database_object_source_schema_class:
    name: database_object_source_schema_class
    definition_uri: https://w3id.org/reactome-ontology/source_schema_class
    description: Name of the source Reactome schema class from which the instance
      derives.
    comments:
    - Useful when preserving frame-schema provenance or round-tripping with the original
      Reactome graph.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:sourceSchemaClass
    is_a: source_schema_class
    domain: database_object
    slot_uri: reactome:sourceSchemaClass
    alias: source_schema_class
    owner: database_object
    domain_of:
    - database_object
    is_usage_slot: true
    usage_slot_name: source_schema_class
    range: string
    required: true
    multivalued: false
  database_object_display_label:
    name: database_object_display_label
    definition_uri: https://w3id.org/reactome-ontology/display_label
    description: Preferred display label used by Reactome for user-facing presentation.
    comments:
    - Often combines identity and contextual state into a concise label.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:displayLabel
    is_a: display_label
    domain: database_object
    slot_uri: reactome:displayLabel
    alias: display_label
    owner: database_object
    domain_of:
    - database_object
    is_usage_slot: true
    usage_slot_name: display_label
    range: string
    required: true
    multivalued: false
  pathway_has_event:
    name: pathway_has_event
    definition_uri: https://w3id.org/reactome-ontology/has_event
    description: Membership relation linking a pathway to constituent events.
    comments:
    - Pathways in Reactome are curated groupings of events and can overlap with other
      pathways.
    - inlined:false so that events are stored as references, not embedded objects.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasEvent
    is_a: has_event
    domain: pathway
    slot_uri: reactome:hasEvent
    alias: has_event
    owner: pathway
    domain_of:
    - pathway
    is_usage_slot: true
    usage_slot_name: has_event
    range: event
    required: true
    multivalued: true
    inlined: false
  reaction_has_input:
    name: reaction_has_input
    definition_uri: https://w3id.org/reactome-ontology/has_input
    description: Physical entity consumed, transformed, or otherwise used as an input
      to a reaction-like event.
    comments:
    - Inputs need not always be fully consumed in a strict stoichiometric sense across
      all event subclasses.
    - inlined:false ensures generators emit foreign keys or graph edges.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasInput
    is_a: has_input
    domain: reaction
    slot_uri: reactome:hasInput
    alias: has_input
    owner: reaction
    domain_of:
    - reaction
    is_usage_slot: true
    usage_slot_name: has_input
    range: physical_entity
    required: true
    multivalued: true
    inlined: false
  reaction_has_output:
    name: reaction_has_output
    definition_uri: https://w3id.org/reactome-ontology/has_output
    description: Physical entity produced by a reaction-like event.
    comments:
    - Output identity often reflects new compartment, modification state, or assembly
      state.
    - inlined:false ensures generators emit foreign keys or graph edges.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasOutput
    is_a: has_output
    domain: reaction
    slot_uri: reactome:hasOutput
    alias: has_output
    owner: reaction
    domain_of:
    - reaction
    is_usage_slot: true
    usage_slot_name: has_output
    range: physical_entity
    required: true
    multivalued: true
    inlined: false
  simple_entity_has_reference_entity:
    name: simple_entity_has_reference_entity
    definition_uri: https://w3id.org/reactome-ontology/has_reference_entity
    description: Invariant reference identity underlying a contextualized physical
      entity.
    comments:
    - One of the key distinctions in Reactome; reference identity is separate from
      stateful physical instantiation.
    - inlined:false ensures generators emit a foreign key or graph edge.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasReferenceEntity
    is_a: has_reference_entity
    domain: simple_entity
    slot_uri: reactome:hasReferenceEntity
    alias: has_reference_entity
    owner: simple_entity
    domain_of:
    - simple_entity
    is_usage_slot: true
    usage_slot_name: has_reference_entity
    range: reference_molecule
    required: true
    multivalued: false
    inlined: false
  sequence_entity_has_reference_entity:
    name: sequence_entity_has_reference_entity
    definition_uri: https://w3id.org/reactome-ontology/has_reference_entity
    description: Invariant reference identity underlying a contextualized physical
      entity.
    comments:
    - One of the key distinctions in Reactome; reference identity is separate from
      stateful physical instantiation.
    - inlined:false ensures generators emit a foreign key or graph edge.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasReferenceEntity
    is_a: has_reference_entity
    domain: sequence_entity
    slot_uri: reactome:hasReferenceEntity
    alias: has_reference_entity
    owner: sequence_entity
    domain_of:
    - sequence_entity
    is_usage_slot: true
    usage_slot_name: has_reference_entity
    range: reference_sequence
    required: true
    multivalued: false
    inlined: false
  protein_has_reference_entity:
    name: protein_has_reference_entity
    definition_uri: https://w3id.org/reactome-ontology/has_reference_entity
    description: Invariant reference identity underlying a contextualized physical
      entity.
    comments:
    - One of the key distinctions in Reactome; reference identity is separate from
      stateful physical instantiation.
    - inlined:false ensures generators emit a foreign key or graph edge.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasReferenceEntity
    is_a: sequence_entity_has_reference_entity
    domain: protein
    slot_uri: reactome:hasReferenceEntity
    alias: has_reference_entity
    owner: protein
    domain_of:
    - protein
    is_usage_slot: true
    usage_slot_name: has_reference_entity
    range: reference_gene_product
    required: true
    multivalued: false
    inlined: false
  complex_has_component:
    name: complex_has_component
    definition_uri: https://w3id.org/reactome-ontology/has_component
    description: Component physical entities that make up a complex.
    comments:
    - Complex identity is distinct from component identity in Reactome.
    - inlined:false ensures generators emit foreign keys or graph edges.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasComponent
    is_a: has_component
    domain: complex
    slot_uri: reactome:hasComponent
    alias: has_component
    owner: complex
    domain_of:
    - complex
    is_usage_slot: true
    usage_slot_name: has_component
    range: physical_entity
    required: true
    multivalued: true
    inlined: false
  entity_set_has_member:
    name: entity_set_has_member
    definition_uri: https://w3id.org/reactome-ontology/has_member
    description: Members of an entity set representing functionally interchangeable
      participants.
    comments:
    - Entity sets are curated graph objects, not simply OWL classes over their members.
    - inlined:false ensures generators emit foreign keys or graph edges.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasMember
    is_a: has_member
    domain: entity_set
    slot_uri: reactome:hasMember
    alias: has_member
    owner: entity_set
    domain_of:
    - entity_set
    is_usage_slot: true
    usage_slot_name: has_member
    range: physical_entity
    required: true
    multivalued: true
    inlined: false
  drug_has_reference_entity:
    name: drug_has_reference_entity
    definition_uri: https://w3id.org/reactome-ontology/has_reference_entity
    description: Invariant reference identity underlying a contextualized physical
      entity.
    comments:
    - One of the key distinctions in Reactome; reference identity is separate from
      stateful physical instantiation.
    - inlined:false ensures generators emit a foreign key or graph edge.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasReferenceEntity
    is_a: has_reference_entity
    domain: drug
    slot_uri: reactome:hasReferenceEntity
    alias: has_reference_entity
    owner: drug
    domain_of:
    - drug
    is_usage_slot: true
    usage_slot_name: has_reference_entity
    range: reference_therapeutic
    required: true
    multivalued: false
    inlined: false
  reference_entity_has_reference_database:
    name: reference_entity_has_reference_database
    definition_uri: https://w3id.org/reactome-ontology/has_reference_database
    description: Reference database authority associated with a reference entity or
      database identifier.
    comments:
    - Provides the namespace and interpretation context for an identifier.
    - inlined:false ensures generators emit a foreign key or graph edge.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasReferenceDatabase
    is_a: has_reference_database
    domain: reference_entity
    slot_uri: reactome:hasReferenceDatabase
    alias: has_reference_database
    owner: reference_entity
    domain_of:
    - reference_entity
    is_usage_slot: true
    usage_slot_name: has_reference_database
    range: reference_database
    required: true
    multivalued: false
    inlined: false
  catalyst_activity_has_catalyst:
    name: catalyst_activity_has_catalyst
    definition_uri: https://w3id.org/reactome-ontology/has_catalyst
    description: Physical entity serving as the bearer of a catalyst activity.
    comments:
    - Used inside reified catalyst activity objects.
    - inlined:false ensures generators emit a foreign key or graph edge.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasCatalyst
    is_a: has_catalyst
    domain: catalyst_activity
    slot_uri: reactome:hasCatalyst
    alias: has_catalyst
    owner: catalyst_activity
    domain_of:
    - catalyst_activity
    is_usage_slot: true
    usage_slot_name: has_catalyst
    range: physical_entity
    required: true
    multivalued: false
    inlined: false
  catalyst_activity_has_go_molecular_function:
    name: catalyst_activity_has_go_molecular_function
    definition_uri: https://w3id.org/reactome-ontology/has_go_molecular_function
    description: GO molecular function term asserted in a catalyst activity.
    comments:
    - Reactome reifies catalysis so the molecular function can be attached explicitly.
    - inlined:false ensures generators emit a foreign key or graph edge.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasGoMolecularFunction
    is_a: has_go_molecular_function
    domain: catalyst_activity
    slot_uri: reactome:hasGoMolecularFunction
    alias: has_go_molecular_function
    owner: catalyst_activity
    domain_of:
    - catalyst_activity
    is_usage_slot: true
    usage_slot_name: has_go_molecular_function
    range: go_molecular_function_term
    required: true
    multivalued: false
    inlined: false
  regulation_has_regulator:
    name: regulation_has_regulator
    definition_uri: https://w3id.org/reactome-ontology/has_regulator
    description: Physical entity that exerts regulatory influence on a regulated event.
    comments:
    - May be a protein, complex, small molecule, set, or other physical entity.
    - inlined:false ensures generators emit a foreign key or graph edge.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:hasRegulator
    is_a: has_regulator
    domain: regulation
    slot_uri: reactome:hasRegulator
    alias: has_regulator
    owner: regulation
    domain_of:
    - regulation
    is_usage_slot: true
    usage_slot_name: has_regulator
    range: physical_entity
    required: true
    multivalued: false
    inlined: false
  regulation_regulates:
    name: regulation_regulates
    definition_uri: https://w3id.org/reactome-ontology/regulates
    description: Reaction-like event that is the target of regulation.
    comments:
    - Kept explicit through reified regulation nodes rather than flattened triples.
    - inlined:false ensures generators emit a foreign key or graph edge.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:regulates
    is_a: regulates
    domain: regulation
    slot_uri: reactome:regulates
    alias: regulates
    owner: regulation
    domain_of:
    - regulation
    is_usage_slot: true
    usage_slot_name: regulates
    range: reaction_like_event
    required: true
    multivalued: false
    inlined: false
classes:
  named_entity:
    name: named_entity
    definition_uri: https://w3id.org/reactome-ontology/NamedEntity
    description: Generic named entity used as a lightweight semantic root for serializable
      objects.
    comments:
    - Provides reusable identifier, naming, and descriptive slots independent of the
      Reactome-specific hierarchy.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:NamedEntity
    abstract: true
    slots:
    - id
    - name
    - description
    class_uri: reactome:NamedEntity
  database_object:
    name: database_object
    definition_uri: https://w3id.org/reactome-ontology/DatabaseObject
    description: Root class for most Reactome schema objects and the main provenance-bearing
      superclass.
    comments:
    - Reactome's frame-based model uses DatabaseObject as the common ancestor for
      curated graph records.
    - id is constructed per class; see the id slot comments for the full strategy.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:DatabaseObject
    is_a: named_entity
    slots:
    - id
    - name
    - description
    - category
    - database_object_reactome_db_id
    - reactome_stable_identifier
    - database_object_source_schema_class
    - database_object_display_label
    - synonym
    - definition
    - previous_stable_identifier
    - created
    - modified
    slot_usage:
      reactome_db_id:
        name: reactome_db_id
        required: true
      source_schema_class:
        name: source_schema_class
        required: true
      display_label:
        name: display_label
        required: true
    class_uri: reactome:DatabaseObject
  instance_edit:
    name: instance_edit
    definition_uri: https://w3id.org/reactome-ontology/InstanceEdit
    description: Provenance record describing a curation action such as creation,
      modification, review, or revision.
    comments:
    - Typically stores who performed an edit and when the edit occurred.
    - 'id construction: reactome:ie/{reactomeDbId}, e.g. reactome:ie/54321'
    - No stId exists for this class; reactome_stable_identifier is absent.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:InstanceEdit
    is_a: database_object
    slots:
    - id
    - name
    - description
    - category
    - database_object_reactome_db_id
    - reactome_stable_identifier
    - database_object_source_schema_class
    - database_object_display_label
    - synonym
    - definition
    - previous_stable_identifier
    - created
    - modified
    - instanceEdit__date
    - instanceEdit__author
    attributes:
      date:
        name: date
        description: Timestamp or date string for the edit activity.
        range: datetime
      author:
        name: author
        description: Person or people responsible for the edit activity.
        range: person
        multivalued: true
        inlined: false
    class_uri: reactome:InstanceEdit
  publication:
    name: publication
    definition_uri: https://w3id.org/reactome-ontology/Publication
    description: Publication record used as evidence or supporting documentation for
      curated biology.
    comments:
    - Abstract superclass for specific publication-like records.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:Publication
    is_a: database_object
    abstract: true
    slots:
    - id
    - name
    - description
    - category
    - database_object_reactome_db_id
    - reactome_stable_identifier
    - database_object_source_schema_class
    - database_object_display_label
    - synonym
    - definition
    - previous_stable_identifier
    - created
    - modified
    class_uri: reactome:Publication
  literature_reference:
    name: literature_reference
    definition_uri: https://w3id.org/reactome-ontology/LiteratureReference
    description: Literature citation record, commonly representing a PubMed-indexed
      paper supporting a Reactome assertion.
    comments:
    - Used widely to ground events, regulations, and catalyst activities in the literature.
    - 'id construction: reactome:lit/{reactomeDbId}'
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:LiteratureReference
    is_a: publication
    slots:
    - id
    - name
    - description
    - category
    - database_object_reactome_db_id
    - reactome_stable_identifier
    - database_object_source_schema_class
    - database_object_display_label
    - synonym
    - definition
    - previous_stable_identifier
    - created
    - modified
    - pubmed_id
    class_uri: reactome:LiteratureReference
  person:
    name: person
    definition_uri: https://w3id.org/reactome-ontology/Person
    description: Person record used primarily for provenance, authorship, and curation
      attribution.
    comments:
    - May represent curators, reviewers, or contributors.
    - 'id construction: orcid:{orcidId} when available; otherwise reactome:person/{reactomeDbId}'
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:Person
    is_a: database_object
    slots:
    - id
    - name
    - description
    - category
    - database_object_reactome_db_id
    - reactome_stable_identifier
    - database_object_source_schema_class
    - database_object_display_label
    - synonym
    - definition
    - previous_stable_identifier
    - created
    - modified
    - orcid
    class_uri: reactome:Person
  summation:
    name: summation
    definition_uri: https://w3id.org/reactome-ontology/Summation
    description: Narrative summary record containing prose that explains the biological
      meaning of an entity or event.
    comments:
    - Distinct from a formal definition; meant for human reading.
    - 'id construction: reactome:sum/{reactomeDbId}'
