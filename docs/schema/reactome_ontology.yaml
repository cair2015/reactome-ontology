name: reactome_ontology
description: The Reactome Ontology Model provides a more ontology-oriented and reusable
  representation of core parts of the Reactome data model. Using LinkML as the source
  schema, it describes entities, events, provenance, and related reference objects
  in a consistent and structured way. The model covers pathways, reactions, physical
  entities, regulatory relationships, and supporting metadata through clearly defined
  classes, slots, and ranges. This supports validation, documentation generation,
  ontology export, and downstream integration. Its goal is to provide a clear and
  interoperable foundation for publishing and working with Reactome knowledge in ontology-friendly
  formats.
title: Reactome Ontology Model
comments:
- This schema favors ontology-oriented naming for OWL generation; source mappings
  are maintained in separate mapping files.
- Administrative and serialization helper fields are retained for round-tripping but
  may be omitted from OWL export profiles.
- 'Version 1.1.0 changes vs 1.0.0:'
- '  - id slot: range changed from string to uriorcurie; pattern added; construction
  strategy documented per class'
- '  - ReactomeClassEnum added to document concrete class labels used in serialized
  instances'
- '  - reactome_stable_identifier: key:true added for UNIQUE constraint generation'
- '  - All slots with range pointing to a class: inlined:false added explicitly'
- '  - inlined_as_list removed from slots that are now inlined:false (mutually exclusive)'
- '  - New slots: synonym'
- '  - authored slot moved to event class (was missing from event slot list)'
- '  - drug class: has_reference_entity slot added with required:true, range:reference_therapeutic'
- '  - Prefixes added: Ensembl, DOID'
- '  - category slot added to database_object slots list'
- '  - reactome_stable_identifier required:true removed from database_object (absent
  on supporting nodes)'
id: https://w3id.org/reactome-ontology
version: 1.1.0
imports:
- linkml:types
license: https://creativecommons.org/licenses/by/4.0/
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  reactome:
    prefix_prefix: reactome
    prefix_reference: https://w3id.org/reactome-ontology/
  reactomeid:
    prefix_prefix: reactomeid
    prefix_reference: https://w3id.org/reactome-ontology/id/
  biolink:
    prefix_prefix: biolink
    prefix_reference: https://w3id.org/biolink/vocab/
  GO:
    prefix_prefix: GO
    prefix_reference: http://purl.obolibrary.org/obo/GO_
  CHEBI:
    prefix_prefix: CHEBI
    prefix_reference: http://purl.obolibrary.org/obo/CHEBI_
  UniProtKB:
    prefix_prefix: UniProtKB
    prefix_reference: http://purl.uniprot.org/uniprot/
  Ensembl:
    prefix_prefix: Ensembl
    prefix_reference: http://identifiers.org/ensembl/
  NCBITaxon:
    prefix_prefix: NCBITaxon
    prefix_reference: http://purl.obolibrary.org/obo/NCBITaxon_
  DOID:
    prefix_prefix: DOID
    prefix_reference: http://purl.obolibrary.org/obo/DOID_
  BFO:
    prefix_prefix: BFO
    prefix_reference: http://purl.obolibrary.org/obo/BFO_
  RO:
    prefix_prefix: RO
    prefix_reference: http://purl.obolibrary.org/obo/RO_
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  dcterms:
    prefix_prefix: dcterms
    prefix_reference: http://purl.org/dc/terms/
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  orcid:
    prefix_prefix: orcid
    prefix_reference: https://orcid.org/
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: reactome
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  ReactomeClassEnum:
    name: ReactomeClassEnum
    definition_uri: https://w3id.org/reactome-ontology/ReactomeClassEnum
    description: Closed enumeration of all concrete (non-abstract) Reactome class
      names used as values for the category discriminator slot.
    comments:
    - 'Used by the category slot (designates_type: true) to provide a closed vocabulary
      for type discrimination in serialized instances.'
    - Generators can emit a CHECK constraint (SQL) or enum property (OWL/Python) from
      this list.
    from_schema: https://w3id.org/reactome-ontology
    permissible_values:
      Pathway:
        text: Pathway
        description: Curated grouping of biologically related events.
      Reaction:
        text: Reaction
        description: Standard reaction-like event with balanced inputs and outputs.
      BlackBoxEvent:
        text: BlackBoxEvent
        description: Reaction-like event with incomplete mechanistic detail.
      Polymerization:
        text: Polymerization
        description: Polymer-forming reaction-like event.
      Depolymerization:
        text: Depolymerization
        description: Polymer-breaking reaction-like event.
      SimpleEntity:
        text: SimpleEntity
        description: Small molecule or non-sequence-based chemical participant.
      GenomeEncodedEntity:
        text: GenomeEncodedEntity
        description: Genome-encoded entity whose sequence is unknown.
      SequenceEntity:
        text: SequenceEntity
        description: Sequence-bearing physical entity with accession and optional
          modifications.
      Protein:
        text: Protein
        description: Protein physical entity linked to a reference gene product.
      Complex:
        text: Complex
        description: Multi-component physical entity.
      DefinedSet:
        text: DefinedSet
        description: Explicitly curated set of interchangeable physical entities.
      CandidateSet:
        text: CandidateSet
        description: Candidate set of physical entities fulfilling a shared role.
      Polymer:
        text: Polymer
        description: Polymer physical entity defined by repeated units.
      Cell:
        text: Cell
        description: Cell or cell-like biological unit.
      OtherEntity:
        text: OtherEntity
        description: Catch-all physical entity not covered by more specific subclasses.
      Drug:
        text: Drug
        description: Therapeutic physical entity.
      ChemicalDrug:
        text: ChemicalDrug
        description: Small-molecule therapeutic.
      ProteinDrug:
        text: ProteinDrug
        description: Protein-derived therapeutic.
      RnaDrug:
        text: RnaDrug
        description: RNA-based therapeutic.
      ReferenceGeneProduct:
        text: ReferenceGeneProduct
        description: Gene product reference identity, typically UniProt-backed.
      ReferenceIsoform:
        text: ReferenceIsoform
        description: Isoform-level reference identity.
      ReferenceDnaSequence:
        text: ReferenceDnaSequence
        description: DNA sequence reference identity.
      ReferenceRnaSequence:
        text: ReferenceRnaSequence
        description: RNA sequence reference identity.
      ReferenceMolecule:
        text: ReferenceMolecule
        description: Small-molecule reference identity, typically ChEBI-backed.
      ReferenceGroup:
        text: ReferenceGroup
        description: Grouped reference identity.
      ReferenceTherapeutic:
        text: ReferenceTherapeutic
        description: Therapeutic reference identity.
      ReferenceDatabase:
        text: ReferenceDatabase
        description: External database authority record.
      DatabaseIdentifier:
        text: DatabaseIdentifier
        description: Cross-reference identifier record.
      CatalystActivity:
        text: CatalystActivity
        description: Reified catalytic assertion.
      PositiveRegulation:
        text: PositiveRegulation
        description: Positive regulatory assertion.
      NegativeRegulation:
        text: NegativeRegulation
        description: Negative regulatory assertion.
      Requirement:
        text: Requirement
        description: Requirement-style regulatory assertion.
      Interaction:
        text: Interaction
        description: Interaction record.
      AbstractModifiedResidue:
        text: AbstractModifiedResidue
        description: Modified residue feature on a sequence entity.
      OrganismTaxon:
        text: OrganismTaxon
        description: Organism taxon record.
      Taxon:
        text: Taxon
        description: Taxonomic concept record.
      Compartment:
        text: Compartment
        description: Cellular compartment record.
      Disease:
        text: Disease
        description: Disease context record.
      GoMolecularFunctionTerm:
        text: GoMolecularFunctionTerm
        description: GO molecular function term wrapper.
      GoBiologicalProcessTerm:
        text: GoBiologicalProcessTerm
        description: GO biological process term wrapper.
      GoCellularComponentTerm:
        text: GoCellularComponentTerm
        description: GO cellular component term wrapper.
      InstanceEdit:
        text: InstanceEdit
        description: Provenance edit record.
      LiteratureReference:
        text: LiteratureReference
        description: Literature citation record.
      Person:
        text: Person
        description: Person record for provenance attribution.
      Summation:
        text: Summation
        description: Narrative summary record.
slots:
  id:
    name: id
    definition_uri: https://w3id.org/reactome-ontology/id
    description: Primary stable identifier for an instance, stored as a CURIE or URI.
    comments:
    - Construction strategy varies by class (see class-level comments for details).
    - 'Biological objects (Event, PhysicalEntity subclasses): reactome:{stId}, e.g.
      reactome:R-HSA-983169'
    - 'ReferenceGeneProduct / ReferenceIsoform: UniProtKB:{accession}, e.g. UniProtKB:P60484'
    - 'ReferenceDnaSequence / ReferenceRnaSequence: Ensembl:{accession}'
    - 'ReferenceMolecule: CHEBI:{id}, e.g. CHEBI:15422'
    - 'OrganismTaxon / Taxon: NCBITaxon:{taxId}, e.g. NCBITaxon:9606'
    - 'GO term wrappers and Compartment: GO:{id}, e.g. GO:0005737'
    - 'Disease: DOID:{id} where available, e.g. DOID:162'
    - 'Supporting nodes without stId (CatalystActivity, Regulation, InstanceEdit,
      Summation, ReferenceDatabase, ReferenceTherapeutic, ReferenceGroup): reactome:{classPrefix}/{reactomeDbId},
      e.g. reactome:ca/1218822, reactome:ie/54321'
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - dcterms:identifier
    slot_uri: dcterms:identifier
    identifier: true
    owner: named_entity
    domain_of:
    - named_entity
    range: uriorcurie
    required: true
    pattern: ^[A-Za-z][A-Za-z0-9_.+-]*:.+
  category:
    name: category
    definition_uri: https://w3id.org/reactome-ontology/category
    description: Concrete class discriminator used in serialized instances.
    comments:
    - Must remain range:string. LinkML's pythongen requires the designates_type slot
      to carry a plain string class name and does not support an enum range here.
    - The ReactomeClassEnum in this schema documents the closed vocabulary of valid
      values and is used by JSON Schema and OWL generators, but cannot be referenced
      directly by this slot without breaking gen-python.
    - Valid values are the permissible_values keys of ReactomeClassEnum, e.g. Pathway,
      Reaction, EntityWithAccessionedSequence, CatalystActivity, etc.
    from_schema: https://w3id.org/reactome-ontology
    slot_uri: reactome:category
    owner: database_object
    domain_of:
    - database_object
    range: string
  name:
    name: name
    definition_uri: https://w3id.org/reactome-ontology/name
    description: Human-readable primary label for an object.
    comments:
    - Generic reusable naming slot for schema-wide use.
    - When the source Reactome name field is multivalued, the first value is promoted
      here as the primary ontology label.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - rdfs:label
    slot_uri: rdfs:label
    owner: named_entity
    domain_of:
    - named_entity
    range: string
  synonym:
    name: synonym
    definition_uri: https://w3id.org/reactome-ontology/synonym
    description: Alternative names or synonyms for an object.
    comments:
    - For Reactome DatabaseObject records, this can capture additional values from
      the source name list after the first value is used as the primary name.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - skos:altLabel
    slot_uri: skos:altLabel
    owner: database_object
    domain_of:
    - database_object
    range: string
    multivalued: true
  description:
    name: description
    definition_uri: https://w3id.org/reactome-ontology/description
    description: Free-text textual description of an object.
    comments:
    - Can hold editorial notes, plain-language explanations, or short summaries.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - dcterms:description
    slot_uri: dcterms:description
    owner: named_entity
    domain_of:
    - named_entity
    range: string
    multivalued: false
  reactome_db_id:
    name: reactome_db_id
    definition_uri: https://w3id.org/reactome-ontology/reactome_db_id
    description: Internal Reactome database identifier assigned to a database object.
    comments:
    - Kept for provenance and round-tripping only; never used as a foreign key in
      this ontology schema.
    - Reactome DB_ID values are implementation-oriented integers rather than stable
      public identifiers.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:reactomeDbId
    slot_uri: reactome:reactomeDbId
    owner: database_object
    domain_of:
    - database_object
    range: integer
    multivalued: false
  reactome_stable_identifier:
    name: reactome_stable_identifier
    definition_uri: https://w3id.org/reactome-ontology/reactome_stable_identifier
    description: Stable public Reactome identifier for an object, where one exists.
    comments:
    - Typically the R-HSA-xxxxx accession assigned to curated biological objects.
    - Present on Events, PhysicalEntities, and ReferenceEntities; absent on supporting
      nodes such as CatalystActivity, InstanceEdit, and Summation.
    - Not marked key:true because LinkML only permits one identifier per class hierarchy
      (id already serves that role). Downstream generators (SQL DDL, Neo4j Cypher)
      should add a UNIQUE constraint / index on this column independently, using the
      source_schema_class or class label to scope it to classes where it is populated.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:reactomeStableIdentifier
    slot_uri: reactome:reactomeStableIdentifier
    owner: database_object
    domain_of:
    - database_object
    range: string
    multivalued: false
  source_schema_class:
    name: source_schema_class
    definition_uri: https://w3id.org/reactome-ontology/source_schema_class
    description: Name of the source Reactome schema class from which the instance
      derives.
    comments:
    - Useful when preserving frame-schema provenance or round-tripping with the original
      Reactome graph.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:sourceSchemaClass
    slot_uri: reactome:sourceSchemaClass
    owner: database_object
    domain_of:
    - database_object
    range: string
    multivalued: false
  display_label:
    name: display_label
    definition_uri: https://w3id.org/reactome-ontology/display_label
    description: Preferred display label used by Reactome for user-facing presentation.
    comments:
    - Often combines identity and contextual state into a concise label.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:displayLabel
    is_a: name
    slot_uri: reactome:displayLabel
    owner: database_object
    domain_of:
    - database_object
    range: string
    multivalued: false
  definition:
    name: definition
    definition_uri: https://w3id.org/reactome-ontology/definition
    description: Curated textual definition that states what the object is.
    comments:
    - Intended for conceptual definitions rather than narrative summaries.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:definition
    slot_uri: reactome:definition
    owner: database_object
    domain_of:
    - database_object
    range: string
    multivalued: false
  systematic_name:
    name: systematic_name
    definition_uri: https://w3id.org/reactome-ontology/systematic_name
    description: Formal or systematic name for an entity when available.
    comments:
    - Often useful for chemicals, complexes, or sequence-derived entities.
    from_schema: https://w3id.org/reactome-ontology
    mappings:
    - reactome:systematicName
    slot_uri: reactome:systematicName
    owner: physical_entity
    domain_of:
    - physical_entity
    range: string
    multivalued: false
  release_date:
